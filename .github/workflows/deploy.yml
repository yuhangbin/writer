name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r .next/standalone deploy/
          cp -r .next/static deploy/.next/
          cp -r public deploy/
          cp package.json deploy/
          cp next.config.ts deploy/
          cd deploy && tar -czf ../deploy.tar.gz .

      - name: Copy deployment package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deploy.tar.gz,.github/scripts/deploy.sh"
          target: "/tmp"
          strip_components: 0

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,DATABASE_URL,UNIFIED_API_BASE_URL,UNIFIED_API_KEY
          script: |
            # Set environment variables
            export DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            export UNIFIED_API_BASE_URL="${{ secrets.UNIFIED_API_BASE_URL }}"
            export UNIFIED_API_KEY="${{ secrets.UNIFIED_API_KEY }}"

            # Make deploy script executable
            chmod +x /tmp/deploy.sh

            # Run deployment script
            /tmp/deploy.sh
