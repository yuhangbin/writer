name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Create deployment package
        run: |
          mkdir -p deploy
          cp -r .next/standalone deploy/
          cp -r .next/static deploy/.next/
          cp -r public deploy/
          cp package.json deploy/
          cp next.config.ts deploy/
          cp -r lib/generated deploy/lib/
          cd deploy && tar -czf ../deploy.tar.gz .

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment package to VPS
        run: |
          scp -P ${{ secrets.SSH_PORT || 22 }} \
            deploy.tar.gz \
            .github/scripts/deploy.sh \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/tmp/

      - name: Deploy to VPS via SSH
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "export DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' && \
             export DATABASE_URL='${{ secrets.DATABASE_URL }}' && \
             export UNIFIED_API_BASE_URL='${{ secrets.UNIFIED_API_BASE_URL }}' && \
             export UNIFIED_API_KEY='${{ secrets.UNIFIED_API_KEY }}' && \
             chmod +x /tmp/deploy.sh && /tmp/deploy.sh"
